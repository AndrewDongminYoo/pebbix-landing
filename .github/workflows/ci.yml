name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.28.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Check localized production routes
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/next/dist/bin/next start --port 4179 > "$RUNNER_TEMP/pebbix-next-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if grep -q 'Ready in' "$RUNNER_TEMP/pebbix-next-server.log"; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          for locale in en ko; do
            for route in '' /privacy /terms; do
              html="$(curl --fail --silent --show-error "http://127.0.0.1:4179/$locale$route")"
              grep --fixed-strings --quiet "lang=\"$locale\"" <<< "$html"
            done
          done
